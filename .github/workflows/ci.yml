name: SQA CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sqa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: artifacts/agenda-contactos.zip
  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agenda_sqa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      XDEBUG_MODE: coverage
      REQUIRE_PHP_COVERAGE: '1'
      SQA_DB_HOST: '127.0.0.1'
      SQA_DB_PORT: '3306'
      SQA_DB_NAME: agenda_sqa
      SQA_DB_USER: root
      SQA_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: xdebug
      - run: npm ci
      - run: npm test
      - name: Plugin PHP regression tests and coverage (WordPress doubles)
        run: npm run test:php
      - name: Verify MySQL service connectivity and persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          php <<'PHP' | tee reports/mysql-service.txt
          <?php
          mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
          $db = new mysqli(
              getenv('SQA_DB_HOST'),
              getenv('SQA_DB_USER'),
              getenv('SQA_DB_PASSWORD'),
              getenv('SQA_DB_NAME'),
              (int) getenv('SQA_DB_PORT')
          );
          $db->set_charset('utf8mb4');
          $db->query('CREATE TEMPORARY TABLE sqa_ci_probe (id INT PRIMARY KEY, value VARCHAR(32) NOT NULL)');
          $db->query("INSERT INTO sqa_ci_probe (id, value) VALUES (1, 'agenda-sqa')");
          $row = $db->query('SELECT value FROM sqa_ci_probe WHERE id = 1')->fetch_assoc();
          if (($row['value'] ?? null) !== 'agenda-sqa') {
              throw new RuntimeException('MySQL write/read verification failed.');
          }
          $db->close();
          echo "OK: MySQL service write/read at 127.0.0.1:3306, database agenda_sqa.\n";
          PHP
      - name: Record test scope
        run: |
          echo "PHP regression tests load the plugin with WordPress/database doubles." >> "$GITHUB_STEP_SUMMARY"
          echo "MySQL connectivity and write/read are checked separately against the CI service." >> "$GITHUB_STEP_SUMMARY"
          echo "WordPress integration and HTTP/Postman E2E are not run by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage/
            reports/
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agenda_sqa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SQA_DB_HOST: '127.0.0.1:3306'
      SQA_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - run: npm ci
      - name: Add local Newman to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      # Only this E2E job needs a real WordPress HTTP server.
      # unzip -o overwrites without prompting; no WP-CLI is used.
      - name: Start disposable E2E application (non-interactive)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime reports
          curl --fail --location https://wordpress.org/wordpress-6.8.3.zip -o .runtime/wordpress.zip
          unzip -oq .runtime/wordpress.zip -d .runtime
          cp -r desa_Agenda_Proyecto2/agenda-contactos .runtime/wordpress/wp-content/plugins/
          php scripts/setup-wp.php
          php -S 127.0.0.1:8080 -t .runtime/wordpress > reports/e2e-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:8080/?pagename=mis-contactos' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The E2E application did not become ready."
          exit 1
      - name: E2E contacts with Newman
        run: newman run tests/e2e/postman/agenda-collection.json -e tests/e2e/postman/env.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-server-log
          path: reports/e2e-server.log
  analyze:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-evidence
          path: reports/
  report:
    if: always()
    needs: [build, test, analyze, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: test-evidence
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: analysis-evidence
          path: reports
        continue-on-error: true
      - run: npm run report
        env:
          SQA_BUILD: ${{ needs.build.result }}
          SQA_TEST: ${{ needs.test.result }}
          SQA_ANALYZE: ${{ needs.analyze.result }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-dashboard
          path: reports/dashboard.html
      - name: Quality Gate
        if: always()
        env:
          RESULTS: '${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.analyze.result }} ${{ needs.e2e.result }}'
        run: test "$RESULTS" = "success success success success"
